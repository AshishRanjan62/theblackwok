async function custNo(ph,name,uid){const m=cm();if(m[ph])return m[ph];const n=await runTransaction(db,async t=>{const pr=doc(db,"phones",ph),ps=await t.get(pr);if(ps.exists())return ps.data().n;const cr=doc(db,"meta","counter"),cs=await t.get(cr),n=(cs.exists()?cs.data().n:0)+1;t.set(cr,{n});t.set(pr,{n});t.set(doc(db,"customers","customer-"+n),{customerNo:n,label:"Customer "+n,name,phone:ph,customerId:uid,createdAt:ts()});return n});m[ph]=n;try{localStorage.setItem("bw3_cmap",JSON.stringify(m))}catch(e){}return n}
const _w={};
const watch=(no,ty)=>{const k=no;if(_w[k])return;_w[k]=1;onSnapshot(doc(db,"orders",no.replace("#","")),s=>{if(s.exists())window.onOrderSnap(no,s.data())},()=>{_w[k]=0})};
const _wc={};const watchCall=id=>{if(_wc[id])return;_wc[id]=1;onSnapshot(doc(db,"staffCalls",id),s=>{if(s.exists())window.onStaffSnap(id,s.data())},()=>{_wc[id]=0})};
const notify=(type,id)=>{try{fetch("/.netlify/functions/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type,id}),keepalive:true}).catch(()=>{})}catch(e){}};
window.FB={
add:async(c,d)=>{try{if(c=="staffCalls"){const day=dk(),sid=day+"_"+tk()+"_Table"+d.table;await setDoc(doc(db,"staffCalls",sid),{...d,date:day,time:new Date().toLocaleTimeString("en-GB"),createdAt:ts()});notify("call",sid);try{localStorage.setItem("bw3_call",JSON.stringify({id:sid,ts:Date.now()}))}catch(e){}watchCall(sid);if(d.orderNo)await updateDoc(doc(db,"orders",d.orderNo),{staffCalled:true,staffReasons:arrayUnion(d.reason)}).catch(()=>{});return}return addDoc(collection(db,c),{...d,createdAt:ts()})}catch(e){console.warn(e)}},
order:async(d,no,cb)=>{try{const day=dk(),key=tk()+"_"+no.replace("#","");const n=await custNo(d.customerPhone||d.customerId,d.customerName,d.customerId);await dayDoc(day);const data={...d,customerNo:n,customerLabel:"Customer "+n,date:day,time:new Date().toLocaleTimeString("en-GB"),createdAt:ts()};await setDoc(doc(db,"days",day,"orders",key),data);await setDoc(doc(db,"customers","customer-"+n,"orders",key),data);await setDoc(doc(db,"orders",no.replace("#","")),{...data,staffCalled:false,staffReasons:[]});notify("order",no.replace("#",""));const f={day,key,n,id:no.replace("#","")};cb(f);watch(no)}catch(e){console.warn(e)}},
rate:async(f,rating,review)=>{try{const u={rating,review};await updateDoc(doc(db,"days",f.day,"orders",f.key),u);await updateDoc(doc(db,"customers","customer-"+f.n,"orders",f.key),u);await updateDoc(doc(db,"orders",f.id),u)}catch(e){console.warn(e)}}};
/* live prices: har category ke items (menu/<category>/items/<item>) */
onSnapshot(collectionGroup(db,"items"),s=>window.applyMenu(s.docs.map(x=>({key:x.id,...x.data()}))),e=>console.warn(e));

/* Restaurant ON/OFF: settings/restaurant.acceptingOrders (staff app se) */
onSnapshot(doc(db,"settings","restaurant"),s=>window.setOpen(!s.exists()||s.data().acceptingOrders!==false),e=>console.warn("settings:",e));

/* UPI images: Firestore meta/images se live fetch */
onSnapshot(doc(db,"meta","images"),s=>{
    if(!s.exists()) return;
    const d=s.data()||{};
    if(d.gpay)      IMGU["upi-gpay"]=d.gpay;
    if(d.phonepe)   IMGU["upi-phonepe"]=d.phonepe;
    if(d.paytm)     IMGU["upi-paytm"]=d.paytm;
    if(d.amazonpay) IMGU["upi-amazonpay"]=d.amazonpay;
    render();
},e=>console.warn("UPI images:",e));
(typeof S!="undefined"?S.orders:[]).filter(o=>Date.now()-o.ts<1728e5).forEach(o=>watch(o.id,o.type));
try{const c=JSON.parse(localStorage.getItem("bw3_call"));if(c&&c.id&&Date.now()-c.ts<216e5)watchCall(c.id)}catch(e){}
/* ?seed=1 : menu ko category ke hisab se Firebase mein upload */
if(location.search.includes("seed=1")){const b=document.createElement("button");b.textContent="Upload menu to Firebase";b.style.cssText="position:fixed;z-index:99;top:8px;left:8px;padding:12px;background:#e3262b;color:#fff;border:0;border-radius:10px;font-weight:700";b.onclick=async()=>{b.textContent="Uploading...";try{const cats=[...new Set(MENU.map(m=>m.cat))],cs=new Set(cats.map(slug));for(const c of cats)await setDoc(doc(db,"menu",slug(c)),{name:c});for(const m of MENU)await setDoc(doc(db,"menu",slug(m.cat),"items",m.key),{name:m.name,cat:m.cat,veg:m.veg?1:0,sz:m.sz?1:0,h:m.h??m.price,f:m.f??m.price,price:m.price,image:"images/"+m.img+".jpg",desc:m.desc||""});let del=0;for(const d of(await getDocs(collection(db,"menu"))).docs)if(!cs.has(d.id)){await deleteDoc(d.ref);del++}b.textContent="Done ✔ "+MENU.length+" items in "+cats.length+" categories ("+del+" old removed)"}catch(e){b.textContent="Error: "+e.message}};document.body.appendChild(b)}
}
</script>
</body></html>
